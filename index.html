<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Typing Test</title>
  <link rel="stylesheet" href="speed-typing-test.css">
</head>
<body>

<div class="container">
  <h1>Speed Typing Test</h1>

  <div id="spinner" class="spinner d-none">Loading...</div>

  <div id="quoteDisplay" class="quote-display"></div>

  <textarea id="quoteInput" class="quote-input" placeholder="Start typing here..." disabled></textarea>

  <div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div class="stats">
    <p id="timer">0</p> seconds
  </div>

  <div class="buttons">
    <button id="startBtn">Start</button>
    <button id="submitBtn" disabled>Submit</button>
    <button id="resetBtn">Reset</button>
  </div>

  <p id="result" class="result"></p>
</div>

<script src="speed-typing-test.js"></script>
</body>
</html>
